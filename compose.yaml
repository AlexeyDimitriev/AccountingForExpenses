name: accounting-for-expenses

x-application: &application
  image: accounting-for-expenses:${APP_VERSION:-local}
  build:
    context: .
    dockerfile: Dockerfile

x-database-connection: &database-connection
  DATABASE_URL: ${DATABASE_URL:-host=db port=5432 sslmode=disable}
  PGUSER: ${POSTGRES_USER:-expenses}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
  PGDATABASE: ${POSTGRES_DB:-expenses}

services:
  db:
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["/app/migrate"]
    environment: *database-connection
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application
    environment:
      <<: *database-connection
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-10s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-2s}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    stop_grace_period: ${CONTAINER_STOP_TIMEOUT:-15s}
    restart: unless-stopped

volumes:
  postgres_data:
