apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenses-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expenses-app
  template:
    metadata:
      labels:
        app: expenses-app
    spec:
      containers:
      - name: app
        image: accounting-for-expenses:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: expenses-config
        - secretRef:
            name: expenses-db
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: expenses-app
spec:
  selector:
    app: expenses-app
  ports:
  - name: http
    port: 8080
    targetPort: http
  type: ClusterIP
