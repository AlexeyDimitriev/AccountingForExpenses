apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: expenses-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expenses-postgres
  template:
    metadata:
      labels:
        app: expenses-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: expenses-config
              key: PGUSER
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: expenses-config
              key: PGDATABASE
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: expenses-db
              key: PGPASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 3
          timeoutSeconds: 2
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
  strategy:
    type: Recreate
